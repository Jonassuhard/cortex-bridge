[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-bridge"
version = "0.5.4"
description = "Local, consent-bound bridge between ChatGPT and a reviewed executor"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.140.13",
  "uvicorn==0.51.0",
  "websockets==17.0",
  "playwright==1.61.0",
]

[project.scripts]
cortex-console = "server:main"

[tool.setuptools]
package-dir = {"" = "console", "executor" = "executor", "orchestration" = "orchestration", "transport" = "transport"}
py-modules = [
  "attachments",
  "chat",
  "chrome_extension",
  "conversation_sessions",
  "cortex_paths",
  "installer",
  "generation_metadata",
  "generation_install",
  "managed_runtime",
  "bootstrap_install",
  "generation_publication",
  "install_resource_tree",
  "effect_gate",
  "lifecycle_lock",
  "local_executor",
  "missions",
  "onboarding",
  "process_ownership",
  "process_helper_build",
  "runtime_exclusion",
  "server",
  "settings",
  "storage_guard",
  "storage_broker",
  "storage_reconciliation",
  "storage_transition",
  "storage_contract",
  "storage_lifecycle",
  "storage_lock",
  "storage_result",
  "startup_lease",
  "native_helpers",
  "installed_storage_runtime",
  "version",
  "write_slots",
]
packages = [
  "executor",
  "orchestration",
  "transport",
  "transport.browser_playwright",
  "transport.chatgpt_web",
]

[tool.setuptools.package-data]
transport = ["macos_ax_send.swift"]
