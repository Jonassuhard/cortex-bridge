[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-bridge"
version = "0.5.0"
description = "Local, consent-bound bridge between ChatGPT and a reviewed executor"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.140.13",
  "uvicorn==0.51.0",
  "playwright==1.61.0",
]

[project.scripts]
cortex-console = "server:main"

[tool.setuptools]
package-dir = {"" = "console", "executor" = "executor", "orchestration" = "orchestration", "transport" = "transport"}
py-modules = [
  "attachments",
  "chat",
  "conversation_sessions",
  "cortex_paths",
  "installer",
  "local_executor",
  "missions",
  "onboarding",
  "process_ownership",
  "server",
  "settings",
  "version",
  "write_slots",
]
packages = [
  "executor",
  "orchestration",
  "transport",
  "transport.browser_playwright",
  "transport.chatgpt_web",
]
